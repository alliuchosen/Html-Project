<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
      <main class="container">
        <div class="card2">
            <img class="img" src="images/Paymax Logo.png" alt="">
            <h1 style="text-align: center;">SYNC</h1>
            <p style="text-align: center;">Your Time. Your Money. Your Control</p>
            <br>
            <br>

            <div>
                <h2 style="text-align: left;">Get Started by Signing Up</h2>
                <br>
                <form action="">
                    <label for="">Full Name</label>
                    <br>
                    <input type="text" name="name" id="name" placeholder="Enter your full name">
                    <br>
                    <br>
                    <label for="">Email</label>
                    <br>
                    <input type="email" name="email" id="email" placeholder="Enter your Email">
                    <br>
                    <br>
                    <label for="">Date Of Birth</label>
                    <br>
                    <input type="date" name="Birth" id="Birth">
                    <br>
                    <br>
                    <label for="">Password</label>
                    <br>
                    <input type="password" name="password" id="password" placeholder="Enter your password">
                    <br>
                    <br>
                    <label for="">Confrim Password</label>
                    <br>
                    <input type="password" name="passwordC" id="passwordC" placeholder="Confirm your password">
                </form>
                <button class="Login"><a href="#" class="a1">Sign Up</button></a></button>
                <p class="signup">Already have an account? <a href="login.html">Login!</a></p>   
            </div>
        </div>
    </main>
</body>
</html>
